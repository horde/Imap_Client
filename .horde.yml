    - composer-plugin-api: ^2.2.0
    - ext-dom
    - ext-hash
    - ext-iconv
    - ext-intl
    - ext-pcre
    - ext-simplexml
    - ext-spl
  '8.4':
    - php: ^8.4
    - composer-plugin-api: ^2.2.0
    - ext-dom
    - ext-hash
    - ext-iconv
    - ext-intl
    - ext-pcre
    - ext-simplexml
