  date: 2011-04-21
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Return cloned objects from Data results, to prevent issues when caching (Bug #9931).\n[mms] Optimize listing subscribed mailboxes for certain queries.\n[mms] Add support for PARTIAL search/sort results return (RFC 5267 [4.4]).\n[mms] Add support for SEARCH=FUZZY (RFC 6203).\n"
1.0.2:
