    api: stable
  date: 2014-09-17
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Fix IMAP search results for recent and total messages when it is the only query and the mailbox is not selected.\n[mms] Fix client-side message sorting when there are multiple sort criteria and at least one tie in the first sorting criteria.\n[mms] Better error handling when attempting to authenticate via IMAP LOGIN command with non-ASCII credentials (Bug #13554).\n[mms] Fix sending IMAP APPEND data when the UTF-8 capability is enabled.\n[mms] Fix parsing IMAP mailbox list requests when UTF-8 mode is enabled.\n[mms] Ensure client sorting tests work reproducibly across systems with varying default locales.\n"
2.25.0:
  api: 2.25.0
  state:
    release: stable
    api: stable
  date: 2014-09-03
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Add support for Gmail-specific WEBALERT response code.\n[mms] IMAP/POP3 URL generation split into a more modular library structure.\n[mms] Ignore message-specific URL parameters if a search query appears in an IMAP URL.\n[mms] Fix encoding/decoding URL elements in IMAP/POP3 URLs.\n[mms] Fix setting default port for POP3 URLs.\n[mms] Fix client-side reverse sorting.\n[mms] Fix client-side sequence sorting, when that is the only sort criteria.\n[mms] Use Collator class, if present, to sort string fields on the client side.\n[mms] Fix client-side sorting of display addresses.\n[mms] Even more improved pseudo-UIDNEXT value for POP3 servers.\n[mms] Improved sanity checking so that non-ASCII data is not sent to server in commands where it is not supported.\n"
2.24.2:
