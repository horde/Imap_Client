  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "First stable release for Horde 4.\n[mms] Fixes for IMAP servers that support CONDSTORE but disable MODSEQs in mialboxes (Bug #9796).\n[mms] Fix obtaining fetch results when searching by sequence number and using caching.\n[mms] Add ability to sort mailboxes return from Horde_Imap_Client_Base#statusMultiple().\n"
