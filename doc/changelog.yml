    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Support response code for POP3 servers (RFC 2449/3206).\n[mms] Enable cache support for POP3 Socket driver (FETCH data only).\n[mms] Fix APOP authentication for POP3 Socket driver.\n[mms] Fix regression with UTF7-IMAP encoding of non-ascii folder names (Bug #10093).\n"
1.0.6:
  api: 1.0.0
  state:
    release: stable
    api: stable
  date: 2011-05-25
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Fix changedsince FETCH results when no cacheable fields were present in query.\n[mms] Fix/optimize updating Sequence -> UID list when processing EXPUNGEs (Bug #10097).\n[mms] Fix UTF-8 -> UTF7-IMAP encoding of ampersands (Bug #10093).\n[mms] Fix setACL() for Socket driver (was always doing replace instead of add/remove).\n[mms] Fix ACL parsing on RFC 2086 server implementations (Bug #10079).\n[mms] More than one SEARCH response may be sent, so don't overwrite existing values.\n[mms] Disable search caching if a mailbox reports it does not support mod sequences (Bug #9833).\n[mms] Fix storing IMAP flag cache info if specifying both add and remove options to store().\n"
1.0.5:
  api: 1.0.0
  state:
    release: stable
    api: stable
  date: 2011-05-11
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Fix OVERQUOTA Exception error constant (Bug #10068; Felipe Zipitría <fzipi@fing.edu.uy>).\n[mms] Correctly return PERMANENTFLAGS information if missing in server return.\n[mms] Optimizing expunging when using QRESYNC.\n[mms] Optimize re-opening a mailbox R/W if using CONDSTORE/QRESYNC.\n[mms] Optimize statusMultiple() for currently selected mailbox.\n[mms] Optimize search()/thread() in empty mailboxes.\n"
1.0.4:
  api: 1.0.0
  state:
    release: stable
    api: stable
  date: 2011-04-29
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "[mms] Filter CAPABILITY return if sent in response code (Bug #9976).\n[mms] Correctly limit FETCH results when specifying changedsince or vanished options and all requested fetch data is already cached.\n[mms] Fix intermittent issues retrieving FETCH results in Socket driver.\n[mms] Optimize expunging in Socket driver with UIDPLUS servers.\n[mms] Fix parsing NAMESPACE response in Socket driver (Bug #9970).\n"
1.0.3:
  api: 1.0.0
  state:
    release: stable
